name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Unzip, Patch & Build APK
      run: |
        echo "Extracting project..."
        if [ -f "SentinelGuard.zip" ]; then
          unzip -q SentinelGuard.zip
        else
          echo "Error: SentinelGuard.zip not found!"
          exit 1
        fi
        
        # Locate project directory
        BUILD_FILE=$(find . -name "build.gradle.kts" -not -path "*/.*" -print -quit)
        PROJECT_DIR=$(dirname "$BUILD_FILE")
        echo "Project located at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # Patch root build.gradle.kts to avoid version catalog dependency errors
        if [ -f "build.gradle.kts" ]; then
          echo "Patching build.gradle.kts plugins..."
          cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.0" apply false
            id("com.google.devtools.ksp") version "1.9.0-1.0.13" apply false
        }
        EOF
        fi

        # Ensure settings.gradle.kts is clean
        if [ -f "settings.gradle.kts" ]; then
          cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "SentinelGuard"
        include(":app")
        EOF
        fi

        # Build execution
        gradle wrapper
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
