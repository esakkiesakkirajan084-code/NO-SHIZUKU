name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Unzip & Build APK
      run: |
        echo "Extracting project files..."
        if [ -f "SentinelGuard.zip" ]; then
          unzip -q SentinelGuard.zip
        fi
        
        # Find directory containing build.gradle.kts
        BUILD_FILE=$(find . -name "build.gradle.kts" -not -path "*/.*" -print -quit)
        PROJECT_DIR=$(dirname "$BUILD_FILE")
        
        echo "Building from directory: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        gradle wrapper
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
