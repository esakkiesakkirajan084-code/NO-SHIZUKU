name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Extract Project and Build
      run: |
        echo "Extracting SentinelGuard.zip..."
        if [ -f "SentinelGuard.zip" ]; then
          unzip -q SentinelGuard.zip
        else
          echo "Error: SentinelGuard.zip not found at repository root!"
          exit 1
        fi
        
        # Locate the directory containing build.gradle.kts inside the extracted files
        BUILD_FILE=$(find . -name "build.gradle.kts" -not -path "*/.*" -print -quit)
        if [ -z "$BUILD_FILE" ]; then
          echo "Error: build.gradle.kts could not be found after extraction!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$BUILD_FILE")
        echo "Found project directory at: $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        gradle wrapper
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
