name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract, Fix & Build APK
      run: |
        echo "Extracting project..."
        if [ -f "SentinelGuard.zip" ]; then
          unzip -q SentinelGuard.zip
        fi
        
        # Locate project directory
        BUILD_FILE=$(find . -name "build.gradle.kts" -not -path "*/.*" -print -quit)
        PROJECT_DIR=$(dirname "$BUILD_FILE")
        echo "Project located at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # Rewrite app/build.gradle.kts safely
        if [ -f "app/build.gradle.kts" ]; then
          cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("com.google.devtools.ksp")
        }

        android {
            namespace = "com.sentinelguard.security"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.sentinelguard.security"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"

                testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                    proguardFiles(
                        getDefaultProguardFile("proguard-android-optimize.txt"),
                        "proguard-rules.pro"
                    )
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
            implementation("androidx.constraintlayout:constraintlayout:2.1.4")
            
            val roomVersion = "2.6.1"
            implementation("androidx.room:room-runtime:$roomVersion")
            implementation("androidx.room:room-ktx:$roomVersion")
            ksp("androidx.room:room-compiler:$roomVersion")
        }
        EOF
        fi

        # Write clean root build.gradle.kts with AGP 8.2.0
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.0" apply false
            id("com.google.devtools.ksp") version "1.9.0-1.0.13" apply false
        }
        EOF

        # Write settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "SentinelGuard"
        include(":app")
        EOF

        # Force Gradle 8.5 wrapper to avoid Gradle 9 incompatibility crashes
        gradle wrapper --gradle-version 8.5
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
